name: Generate Profile Stats SVG

on:
  schedule:
    - cron: '0 0 * * *' # Runs every day at midnight UTC
  workflow_dispatch:     # Allows manually triggering the run

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run SVG Generator
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python generate_readme_stats.py

      - name: Commit and Push SVG updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dark_mode_preview.svg light_mode_preview.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "Updated README SVGs" && git push)
